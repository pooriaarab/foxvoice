<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxvoice: set up the microphone</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <h1>Set up the microphone</h1>
    <p>foxvoice needs the microphone only while you hold the talk button. Firefox asks once in this tab, and then the sidebar can use it.</p>
    <p>The audio stays on this computer. foxvoice turns the microphone off when you let go.</p>
    <button id="allow" type="button">Allow the microphone</button>
    <p id="result" role="status"></p>
    <script type="module" src="setup.js"></script>
  </body>
</html>
